<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A-Z App</title>
<style>
/* ============================================================
   A-Z App

   The audience is three to six and cannot read, so the design
   does different work from a game for older children: enormous
   tap targets, one decision per screen, warm colour, rounded
   everything, and no red-for-failure anywhere — because nothing
   here is a failure.
   ============================================================ */

:root {
  --ink: #2b2a33;
  --ink-soft: #6b6878;
  --paper: #fffdf7;
  --sun: #ffc93c;
  --leaf: #5bbf5b;
  --sky: #3fa7e0;
  --berry: #ef6f8e;
  --plum: #8d6bd0;
  --shadow: rgba(43, 42, 51, 0.18);
  --font: "Trebuchet MS", "Verdana", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

/* An author `display` rule outranks the browser's own [hidden] styling, so any
   element toggled with .hidden = true would stay on screen. Restate it with
   enough weight to win. */
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; }

body {
  font-family: var(--font);
  color: var(--ink);
  background: #cfeaf6;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow-x: hidden;
}

button { font-family: inherit; }

/* ---------------------------------------------------- layers */

#backdrop { position: fixed; inset: 0; z-index: 0; }
#fx-layer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#fx-flash {
  position: fixed; inset: 0; z-index: 59; pointer-events: none;
  opacity: 0; background: transparent;
}
#fx-flash.is-on { animation: flash var(--flash-ms, 320ms) ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

#app { position: relative; z-index: 1; min-height: 100vh; }

/* ---------------------------------------------------- screens */

.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 14px;
  min-height: 100vh;
  padding: 20px 16px 24px;
}

.screen.is-active { display: flex; animation: screen-in 0.3s ease-out; }

@keyframes screen-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* ---------------------------------------------------- sprites */

.spr {
  display: inline-block;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 0 rgba(43, 42, 51, 0.16));
}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}

@keyframes pop-in {
  0% { transform: scale(0.4); opacity: 0; }
  70% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes wobble {
  0%, 100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(-8px) rotate(-4deg); }
  75% { transform: translateX(8px) rotate(4deg); }
}

/* ---------------------------------------------------- buttons */

/* Chunky, obviously pressable, and big enough for a small hand that is not
   yet accurate. Nothing smaller than 56px tall anywhere a child taps. */
.btn {
  min-height: 56px;
  padding: 14px 26px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.btn:disabled, .btn.is-off { opacity: 0.45; cursor: default; box-shadow: 0 6px 0 var(--ink); }

.btn--big {
  min-height: 72px;
  font-size: 26px;
  padding: 18px 40px;
  background: var(--sun);
}

.btn--small { min-height: 48px; font-size: 15px; padding: 10px 18px; }

.btn--icon {
  min-width: 60px;
  min-height: 60px;
  padding: 0;
  font-size: 27px;
  border-radius: 50%;
}

.menu-stack { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.menu-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ---------------------------------------------------- title */

.title-plate { text-align: center; width: min(620px, 100%); }

.logo {
  margin: 6px 0 0;
  font-size: clamp(72px, 18vw, 136px);
  font-weight: 900;
  letter-spacing: 6px;
  color: var(--paper);
  -webkit-text-stroke: 7px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 10px 0 var(--shadow);
}

.logo span { color: var(--sun); }

.tagline {
  margin: 4px 0 20px;
  font-size: 19px;
  font-weight: 700;
  color: var(--ink);
}

.picker { margin-top: 20px; }

.picker-label {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--ink-soft);
}

.picker-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.seg {
  min-height: 52px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 5px 0 var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}

.seg.is-on { background: var(--leaf); color: var(--paper); transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }

.picker-note { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--ink-soft); }

/* ---------------------------------------------------- panels */

.panel {
  width: min(740px, 100%);
  padding: 24px 22px 28px;
  text-align: center;
  background: var(--paper);
  border: 5px solid var(--ink);
  border-radius: 28px;
  box-shadow: 0 10px 0 var(--shadow);
}

.panel--wide { width: min(920px, 100%); }

.panel-title {
  margin: 0 0 14px;
  font-size: clamp(26px, 5vw, 38px);
  font-weight: 900;
  letter-spacing: 1px;
}

.brief-text { font-size: 18px; font-weight: 600; line-height: 1.6; }

.help-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  text-align: left;
}

.help-card {
  padding: 16px;
  background: #f2f8ee;
  border: 4px solid var(--ink);
  border-radius: 18px;
}

.help-card--grown { background: #eef2fb; }
.help-icon { font-size: 34px; }
.help-card h3 { margin: 6px 0; font-size: 17px; }
.help-card p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-soft); font-weight: 600; }

/* ---------------------------------------------------- play */

.screen--play { justify-content: flex-start; }

.hud {
  width: min(860px, 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.zoo-count {
  flex: 1;
  font-size: 17px;
  font-weight: 800;
  text-align: center;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 999px;
  padding: 10px 16px;
}

.play-main {
  width: min(860px, 100%);
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;    /* sit in the middle, not pinned to the top */
  gap: 14px;
}

.quest-kind {
  margin: 4px 0 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
}

/* The cue: the thing being asked about. It is the biggest thing on screen. */
.cue {
  width: 100%;
  min-height: 168px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px;
  background: var(--paper);
  border: 5px solid var(--ink);
  border-radius: 26px;
  box-shadow: 0 8px 0 var(--shadow);
}

.cue-pic { width: 128px; height: 128px; animation: bob 3s ease-in-out infinite; }
.cue-word { font-size: 26px; font-weight: 900; letter-spacing: 1px; }

.cue-letter {
  font-size: clamp(96px, 22vw, 150px);
  font-weight: 900;
  line-height: 1;
  color: var(--sky);
  -webkit-text-stroke: 6px var(--ink);
  paint-order: stroke fill;
}

.cue-seq { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.seq-cell {
  width: 68px;
  height: 84px;
  display: grid;
  place-items: center;
  font-size: 44px;
  font-weight: 900;
  background: #f2f8ee;
  border: 4px solid var(--ink);
  border-radius: 14px;
}

.seq-cell.is-gap { background: var(--sun); color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }

/* The answer tiles. Three to five, always huge. */
.options {
  width: 100%;
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(3, 1fr);
}

.options--n4 { grid-template-columns: repeat(2, 1fr); }
.options--n5 { grid-template-columns: repeat(3, 1fr); }

.opt {
  min-height: 104px;
  display: grid;
  place-items: center;
  font-size: 60px;
  font-weight: 900;
  line-height: 1;
  color: var(--ink);
  background: var(--paper);
  border: 5px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 7px 0 var(--ink);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.opt:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
.opt:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.opt--sprite { min-height: 128px; }
.opt-pic { width: 92px; height: 92px; }

.opt.is-right {
  background: var(--leaf);
  color: var(--paper);
  animation: pop-in 0.35s ease-out;
}

/* Wrong is a wobble and a fade, never a red cross. Nothing is lost. */
.opt.is-wrong { animation: wobble 0.4s ease-in-out; opacity: 0.35; }

/* ---------------------------------------------------- feedback */

.feedback {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  background: var(--leaf);
  border: 5px solid var(--ink);
  border-radius: 24px;
  box-shadow: 0 8px 0 var(--shadow);
  color: var(--paper);
}

.feedback.is-in { animation: pop-in 0.35s ease-out; }
.fb-pic { width: 84px; height: 84px; flex: 0 0 auto; animation: bob 2.4s ease-in-out infinite; }
.fb-words { flex: 1; text-align: left; }
.fb-head { margin: 0; font-size: 30px; font-weight: 900; }
.fb-line { margin: 2px 0 0; font-size: 20px; font-weight: 700; }
.fb-joined { margin: 4px 0 0; font-size: 15px; font-weight: 700; opacity: 0.9; }
.feedback .btn { background: var(--paper); }

/* ---------------------------------------------------- the zoo */

.zoo-wrap { width: min(860px, 100%); }

.zoo-strip {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 10px;
  background: rgba(255, 253, 247, 0.72);
  border: 4px dashed rgba(43, 42, 51, 0.35);
  border-radius: 22px;
}

.zoo-strip--big { border-style: solid; margin-bottom: 14px; }

.zoo-slot {
  width: 58px;
  height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(43, 42, 51, 0.06);
  border-radius: 14px;
}

.zoo-slot.is-home { background: #eaf6e2; animation: pop-in 0.4s ease-out; }
.zoo-pic { width: 42px; height: 42px; }
.zoo-slot b { font-size: 14px; font-weight: 900; }

/* ---------------------------------------------------- my letters */

.stats-summary { margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--ink-soft); }

.letter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(62px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.letter-cell {
  padding: 6px 2px;
  border: 4px solid var(--ink);
  border-radius: 14px;
  background: #efefef;
}

.letter-cell b { display: block; font-size: 22px; font-weight: 900; }
.letter-pic { width: 34px; height: 34px; }

.letter-cell.is-unseen,   .swatch.is-unseen   { background: #ececec; }
.letter-cell.is-learning, .swatch.is-learning { background: #ffe07a; }
.letter-cell.is-shaky,    .swatch.is-shaky    { background: #ff9e9e; }
.letter-cell.is-mastered, .swatch.is-mastered { background: #a8e59a; }

.legend { list-style: none; margin: 0 0 14px; padding: 0; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.legend li { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.swatch { width: 18px; height: 18px; border: 3px solid var(--ink); border-radius: 6px; }

.weak-title { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
.weak-list { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }

.weak-chip {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 8px 13px;
  background: #ffeaea;
  border: 4px solid var(--ink);
  border-radius: 14px;
}

.weak-chip b { font-size: 20px; font-weight: 900; }
.weak-chip span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }

/* ---------------------------------------------------- toast */

.toast {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  width: max-content;
  max-width: calc(100% - 32px);
  margin: 0 auto;
  z-index: 70;
  padding: 14px 26px;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  background: var(--sun);
  border: 4px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 6px 0 var(--shadow);
  animation: pop-in 0.28s ease-out;
}

/* ---------------------------------------------------- small screens */

@media (max-width: 700px) {
  .screen { padding: 14px 12px 20px; gap: 10px; }
  .cue { min-height: 140px; border-radius: 22px; }
  .cue-pic { width: 104px; height: 104px; }
  .cue-word { font-size: 22px; }
  .opt { min-height: 88px; font-size: 46px; border-radius: 18px; }
  .opt--sprite { min-height: 104px; }
  .opt-pic { width: 74px; height: 74px; }
  .zoo-slot { width: 48px; height: 54px; }
  .zoo-pic { width: 34px; height: 34px; }
  .feedback { flex-direction: column; text-align: center; }
  .fb-words { text-align: center; }
  .seq-cell { width: 56px; height: 70px; font-size: 34px; }
  .btn--big { min-height: 64px; font-size: 22px; padding: 16px 28px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ------------------------------------------- letters without an animal */

/* Czech Ď, Ň, Ť and the long vowels cannot begin a word, so they have no
   picture. They are still collected and still shown — as themselves. */
.face-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 900;
  color: var(--ink);
  background: none;
}

.fb-pic.face-letter { font-size: 54px; }
.letter-cell.is-wordless b { padding: 7px 0; }

.voice-note {
  margin: 8px auto 0;
  max-width: 420px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  color: var(--ink-soft);
}

/* The voice picker is the one control here aimed at a parent rather than a
   child, so it is a plain select — familiar, keyboard-reachable, and it does
   not need a 56px tap target the way the answer tiles do. */
.voice-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
}

.voice-select {
  flex: 1 1 220px;
  max-width: 320px;
  min-height: 48px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 5px 0 var(--ink);
}

.voice-select:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app">

    <!-- ============================ TITLE ============================ -->
    <section class="screen is-active" id="s-title">
      <div class="title-plate">
        <h1 class="logo">A<span>·</span>Z</h1>
        <p class="tagline" data-i18n="ui.tagline"></p>

        <div class="menu-stack">
          <button class="btn btn--big" data-action="start" id="start-btn">START</button>
        </div>

        <div class="picker">
          <p class="picker-label" data-i18n="ui.level"></p>
          <div class="picker-row" id="level-row"></div>
          <p class="picker-note" id="level-note"></p>
        </div>

        <div class="menu-row">
          <button class="btn" data-action="help" data-i18n="ui.howToPlay"></button>
          <button class="btn" data-action="stats" data-i18n="ui.myLetters"></button>
        </div>

        <div class="picker">
          <p class="picker-label" data-i18n="ui.language"></p>
          <div class="picker-row" id="language-row"></div>
        </div>

        <div class="menu-row">
          <button class="btn btn--small" data-action="sound" id="sound-btn"></button>
          <button class="btn btn--small" data-action="voice" id="voice-btn"></button>
        </div>
        <div class="picker voice-picker" id="voice-picker" hidden>
          <p class="picker-label" data-i18n="ui.voicePick"></p>
          <div class="voice-row">
            <select class="voice-select" id="voice-select"></select>
            <button class="btn btn--small" data-action="voice-test" id="voice-test"></button>
          </div>
          <p class="voice-note" id="voice-note" hidden></p>
        </div>
      </div>
    </section>

    <!-- ============================ HELP ============================= -->
    <section class="screen" id="s-help">
      <div class="panel panel--wide">
        <h2 class="panel-title" data-i18n="help.title"></h2>
        <div class="help-grid">
          <div class="help-card">
            <div class="help-icon">🔊</div>
            <h3 data-i18n="help.listen.title"></h3>
            <p data-i18n="help.listen.body"></p>
          </div>
          <div class="help-card">
            <div class="help-icon">👆</div>
            <h3 data-i18n="help.tap.title"></h3>
            <p data-i18n="help.tap.body"></p>
          </div>
          <div class="help-card">
            <div class="help-icon">🏡</div>
            <h3 data-i18n="help.zoo.title"></h3>
            <p data-i18n="help.zoo.body"></p>
          </div>
          <div class="help-card help-card--grown">
            <div class="help-icon">👩‍🏫</div>
            <h3 data-i18n="help.grown.title"></h3>
            <p data-i18n="help.grown.body"></p>
          </div>
        </div>
        <div class="menu-stack">
          <button class="btn btn--big" data-action="home" data-i18n="ui.back"></button>
        </div>
      </div>
    </section>

    <!-- ============================ PLAY ============================= -->
    <section class="screen screen--play" id="s-play">
      <header class="hud">
        <button class="btn btn--icon" data-action="home" aria-label="home">🏠</button>
        <div class="zoo-count" id="zoo-count"></div>
        <button class="btn btn--icon" data-action="replay" aria-label="say it again">🔊</button>
      </header>

      <main class="play-main">
        <p class="quest-kind" id="quest-kind"></p>
        <div class="cue" id="cue"></div>
        <div class="options" id="options"></div>

        <div class="feedback" id="feedback" hidden>
          <div class="fb-pic spr" id="fb-pic"></div>
          <div class="fb-words">
            <p class="fb-head" id="fb-head"></p>
            <p class="fb-line" id="fb-line"></p>
            <p class="fb-joined" id="fb-joined"></p>
          </div>
          <button class="btn btn--big" data-action="next" id="fb-next"></button>
        </div>
      </main>

      <footer class="zoo-wrap">
        <div class="zoo-strip" id="zoo-strip"></div>
      </footer>
    </section>

    <!-- ========================== ZOO FULL =========================== -->
    <section class="screen" id="s-zoo">
      <div class="panel">
        <h2 class="panel-title" data-i18n="zoo.title"></h2>
        <div class="zoo-strip zoo-strip--big" id="zoo-full-row"></div>
        <p class="brief-text" id="zoo-full-text"></p>
        <div class="menu-stack">
          <button class="btn btn--big" data-action="new-zoo" data-i18n="zoo.next"></button>
          <button class="btn" data-action="home" data-i18n="ui.back"></button>
        </div>
      </div>
    </section>

    <!-- ========================= MY LETTERS ========================== -->
    <section class="screen" id="s-stats">
      <div class="panel panel--wide">
        <h2 class="panel-title" data-i18n="stats.title"></h2>
        <p class="stats-summary" id="stats-summary"></p>
        <div class="letter-grid" id="letter-grid"></div>
        <ul class="legend" id="stats-legend"></ul>
        <p class="weak-title" id="weak-title" data-i18n="stats.weakest"></p>
        <div class="weak-list" id="weak-list"></div>
        <p class="picker-note" data-i18n="stats.hint"></p>
        <div class="menu-row">
          <button class="btn" data-action="home" data-i18n="ui.back"></button>
          <button class="btn" data-action="reset-stats" data-i18n="stats.reset"></button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" hidden></div>
    <canvas id="fx-layer" aria-hidden="true"></canvas>
    <div id="fx-flash" aria-hidden="true"></div>
  </div>

<script>
/* ===== js/textures.js ===== */
'use strict';

/* Procedural 16x16 block textures, drawn at boot and handed to CSS as data
   URLs. Keeps the repo free of binary assets and keeps everything crisp,
   because each texel is scaled up with image-rendering: pixelated. */
const Tex = (function () {

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function toRgb(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function shade(hex, amount) {
    const [r, g, b] = toRgb(hex);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v + amount)));
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }

  function canvas(size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    return c;
  }

  /* style: noise | planks | bricks | ore */
  function block(base, opts) {
    opts = opts || {};
    const size = 16;
    const variance = opts.variance == null ? 26 : opts.variance;
    const style = opts.style || 'noise';
    const rand = mulberry32(hashString(base + style + variance));
    const c = canvas(size);
    const g = c.getContext('2d');

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let amount = Math.round((rand() * 2 - 1) * variance);

        if (style === 'planks') {
          // Horizontal boards with a dark seam every 4 rows.
          if (y % 4 === 3) amount -= 44;
          if (y % 4 === 0) amount += 16;
          if ((x + (y < 8 ? 0 : 7)) % 16 === 0) amount -= 38;
        } else if (style === 'bricks') {
          const row = Math.floor(y / 4);
          const offset = row % 2 === 0 ? 0 : 4;
          if (y % 4 === 0) amount -= 40;
          if ((x + offset) % 8 === 0) amount -= 40;
        }

        g.fillStyle = shade(base, amount);
        g.fillRect(x, y, 1, 1);
      }
    }

    if (style === 'ore') {
      const spec = opts.speck || '#ffffff';
      const blobs = 5;
      for (let i = 0; i < blobs; i++) {
        const bx = Math.floor(rand() * 13);
        const by = Math.floor(rand() * 13);
        const w = 2 + Math.floor(rand() * 2);
        g.fillStyle = spec;
        g.fillRect(bx, by, w, w);
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.fillRect(bx, by, 1, 1);
      }
    }

    // Classic block bevel: lit top/left, shaded bottom/right.
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.fillRect(0, 0, size, 1); g.fillRect(0, 0, 1, size);
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.fillRect(0, size - 1, size, 1); g.fillRect(size - 1, 0, 1, size);

    return c.toDataURL();
  }

  /* Pixel-art sprite from a string map. '.' is transparent, any other char
     is looked up in `colors`. An automatic dark outline is traced around it. */
  function sprite(rows, colors, outline) {
    const h = rows.length;
    const w = rows[0].length;
    const c = canvas(Math.max(w, h));
    c.width = w + 2; c.height = h + 2;
    const g = c.getContext('2d');

    const filled = (x, y) =>
      y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.';

    if (outline) {
      g.fillStyle = outline;
      for (let y = -1; y <= h; y++) {
        for (let x = -1; x <= w; x++) {
          if (filled(x, y)) continue;
          if (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1)) {
            g.fillRect(x + 1, y + 1, 1, 1);
          }
        }
      }
    }

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x];
        if (ch === '.') continue;
        g.fillStyle = colors[ch] || '#ff00ff';
        g.fillRect(x + 1, y + 1, 1, 1);
      }
    }
    return c.toDataURL();
  }

  const HEART = [
    '..XX.XX..',
    '.XHXXXXX.',
    'XHXXXXXXX',
    'XXXXXXXXX',
    '.XXXXXXX.',
    '..XXXXX..',
    '...XXX...',
    '....X....'
  ];

  const PALETTE = {
    dirt:     ['#8a5a2b', { variance: 30 }],
    grass:    ['#5d9c41', { variance: 24 }],
    stone:    ['#7d7d7d', { variance: 22 }],
    cobble:   ['#6f6f6f', { variance: 40 }],
    brick:    ['#6d6d6d', { variance: 14, style: 'bricks' }],
    planks:   ['#9c6b3c', { variance: 14, style: 'planks' }],
    obsidian: ['#221733', { variance: 16 }],
    nether:   ['#6e2f2f', { variance: 30 }],
    iron:     ['#d3d3d3', { variance: 16 }],
    gold:     ['#e7c14a', { variance: 18 }],
    diamond:  ['#4fd8cd', { variance: 18 }],
    emerald:  ['#3fbb62', { variance: 18 }],
    redstone: ['#6f6f6f', { variance: 22, style: 'ore', speck: '#d64545' }],
    bedrock:  ['#4a4a4a', { variance: 36 }],
    wool:     ['#e8dcc8', { variance: 12 }],
    sand:     ['#ddcf9a', { variance: 16 }],
    crimson:  ['#7a1f2b', { variance: 26 }],
    moss:     ['#5a7a3a', { variance: 24 }],
    soul:     ['#4a3a30', { variance: 22, style: 'ore', speck: '#8ad4d4' }],
    warped:   ['#2b6a68', { variance: 20 }]
  };

  function install() {
    const root = document.documentElement.style;
    Object.keys(PALETTE).forEach((name) => {
      const [base, opts] = PALETTE[name];
      root.setProperty('--tex-' + name, 'url(' + block(base, opts) + ')');
    });
    root.setProperty('--spr-heart-full',
      'url(' + sprite(HEART, { X: '#e02b2b', H: '#ff8a8a' }, '#2b0606') + ')');
    root.setProperty('--spr-heart-empty',
      'url(' + sprite(HEART, { X: '#4a3a3a', H: '#5a4646' }, '#1b1212') + ')');
  }

  return { install, block, sprite };
})();

   A child this age has to *recognise* the picture or the question is
   unanswerable, so the art is doing real work here — it is not decoration.

   Nine shapes cover twenty-six animals. Each shape paints every feature it
   could possibly have (round ears, pointy ears, long ears, mane, horn, tusk,
   stripes, spots) and a palette defines only the ones this animal actually
   has: a slot the palette leaves undefined is simply not drawn. That is what
   makes a bear, a cat and a rabbit the same shape with different palettes. */

  function maker(grid) {
    const api = {
      px(x, y, c) {
        x = Math.round(x); y = Math.round(y);
        if (c && x >= 0 && x < G && y >= 0 && y < G) grid[y * G + x] = c;
        return api;
      },
      rect(x, y, w, h, c) {
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) api.px(x + i, y + j, c);
        return api;
      },
      disc(cx, cy, r, c) {
        for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
          if (x * x + y * y <= r * r + r * 0.4) api.px(cx + x, cy + y, c);
        }
        return api;
      },
      line(x0, y0, x1, y1, c) {
        const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
        let err = dx - dy, x = x0, y = y0;
        for (let guard = 0; guard < 64; guard++) {
          api.px(x, y, c);
          if (x === x1 && y === y1) break;
          const e2 = 2 * err;
          if (e2 > -dy) { err -= dy; x += sx; }
          if (e2 < dx) { err += dx; y += sy; }

        return api;
      }
    };

    beetroot:  ['beet', { body:'#a02a5a', root:'#d8a0b8', stem:'#4a8a3a', leaf:'#5fae3f', shine:'#d05a88' }],
    snail:     ['snail', { body:'#e8c8a0', shell:'#c08a3a', shellIn:'#e0b060', eye:'#2b1a1a', shine:'#fff', horn:'#d8b890', trail:'#f0e8d8' }],

    zebra:     ['quad', { fur:'#f4f4ec', earP:'#8a8a84', eye:'#1a1a1a', shine:'#fff', snout:'#d8d8d0', nose:'#2b2b2b', paw:'#e4e4dc', stripe:'#2b2b2b', tail:'#2b2b2b' }]
  };

  const cache = {};

  function render(id) {
    const entry = A[id];
    if (!entry) return null;
    const [shapeName, palette] = entry;

    const grid = blank();
    SHAPES[shapeName](maker(grid));
    // A palette that omits a slot loses those pixels — that is how one shape
    // becomes a bear, a cat and a rabbit. Strip them before keylining so the
    // outline traces the real silhouette.
    for (let i = 0; i < grid.length; i++) if (grid[i] && !palette[grid[i]]) grid[i] = null;

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = G * SCALE;
    const g = canvas.getContext('2d');

    const filled = (x, y) => x >= 0 && x < G && y >= 0 && y < G && grid[y * G + x] != null;
    g.fillStyle = 'rgba(20,16,26,0.9)';
    for (let y = -1; y <= G; y++) {
      for (let x = -1; x <= G; x++) {
        if (filled(x, y)) continue;
        if (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1)) {
          g.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
        }
      }
    }
    for (let y = 0; y < G; y++) {
      for (let x = 0; x < G; x++) {
        const slot = grid[y * G + x];
        if (!slot) continue;
        g.fillStyle = palette[slot];
        g.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
      }
    }
    return canvas.toDataURL();
  }

  function url(id) {
    if (!(id in cache)) cache[id] = render(id);
    return cache[id];
  }

  function paint(el, id) {
    if (!el) return;
    const src = url(id);
    el.textContent = '';
    el.classList.add('spr');
    el.style.backgroundImage = src ? 'url(' + src + ')' : '';
    el.dataset.sprite = id || '';
  }

  return { url, paint, has: (id) => id in A, ids: () => Object.keys(A) };
})();


/* ===== js/fx.js ===== */
'use strict';

/* Particle and screen effects, drawn on one full-screen canvas above the UI.

   Everything is blocky on purpose: particles are little squares, not soft
   sprites, so bursts look like a block being broken rather than a generic
   game-engine puff. The loop stops dead when nothing is on screen, so an idle
   game costs nothing. */
const Fx = (function () {

  let canvas = null;
  let ctx = null;
  let particles = [];
  let running = false;
  let reduced = false;

  function init() {
    canvas = document.getElementById('fx-layer');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    reduced = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    window.addEventListener('resize', resize);
  }

  function resize() {
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function tick() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= 1;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      p.vy += p.gravity;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x += p.vx;
      p.y += p.vy;
      if (p.spin) p.rot += p.spin;

      const fade = Math.min(1, p.life / p.fadeFrom);
      ctx.globalAlpha = fade;
      ctx.fillStyle = p.color;
      if (p.rot) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      } else {
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;

    if (particles.length) requestAnimationFrame(tick);
    else running = false;
  }

  function start() {
    if (!running && ctx) { running = true; requestAnimationFrame(tick); }
  }

  function add(p) {
    // A hard cap keeps a long celebration from ever stuttering a cheap laptop.
    if (particles.length > 700) return;
    particles.push(p);
  }

  const PALETTES = {
    good: ['#8ce05a', '#b6ff8a', '#ffffff', '#5fae3f'],
    bad: ['#e2574c', '#ff8a7a', '#7a1f18'],
    gold: ['#ffd75e', '#fff2b0', '#e8a020', '#ffffff'],
    ice: ['#6fe0ff', '#b6f4ff', '#ffffff'],
    ash: ['#8a8a8a', '#c0c0c0', '#5a5a5a']
  };

  function centreOf(el) {
    if (!el) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* A burst of chunky shards from a point. */
  function burst(x, y, opts) {
    if (!ctx || reduced) return;
    const o = opts || {};
    const colours = PALETTES[o.palette || 'gold'];
    const count = o.count || 18;
    const power = o.power || 5;
    for (let i = 0; i < count; i++) {
      const angle = o.angle == null
        ? Math.random() * Math.PI * 2
        : o.angle + (Math.random() - 0.5) * (o.spread || 1.2);
      const speed = power * (0.4 + Math.random() * 0.9);
      add({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (o.lift || 0),
        gravity: o.gravity == null ? 0.28 : o.gravity,
        drag: o.drag || 0.985,
        size: (o.size || 6) * (0.6 + Math.random() * 0.8),
        color: colours[(Math.random() * colours.length) | 0],
        life: (o.life || 48) * (0.6 + Math.random() * 0.7),
        fadeFrom: 22,
        rot: 0,
        spin: (Math.random() - 0.5) * 0.3
      });
    }
    start();
  }

  function at(el, opts) {
    const c = centreOf(el);
    burst(c.x, c.y, opts);
  }

  /* Celebration: shards rain from the top of the screen. */
  function confetti(opts) {
    if (!ctx || reduced) return;
    const o = opts || {};
    const colours = PALETTES[o.palette || 'gold'];
    for (let i = 0; i < (o.count || 90); i++) {
      add({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * 240,
        vx: (Math.random() - 0.5) * 2.4,
        vy: 1.5 + Math.random() * 2.5,
        gravity: 0.06,
        drag: 0.995,
        size: 5 + Math.random() * 7,
        color: colours[(Math.random() * colours.length) | 0],
        life: 150 + Math.random() * 90,
        fadeFrom: 40,
        rot: Math.random() * 6,
        spin: (Math.random() - 0.5) * 0.25
      });
    }
    start();
  }

  /* A rising column, for a block landing in the crafting grid. */
  function place(el, colour) {
    if (!ctx || reduced) return;
    const c = centreOf(el);
    for (let i = 0; i < 10; i++) {
      add({
        x: c.x + (Math.random() - 0.5) * 26,
        y: c.y + 12,
        vx: (Math.random() - 0.5) * 1.6,
        vy: -1 - Math.random() * 2,
        gravity: 0.08,
        drag: 0.97,
        size: 4 + Math.random() * 4,
        color: colour || '#d8d8d8',
        life: 30 + Math.random() * 20,
        fadeFrom: 20,
        rot: 0,
        spin: 0
      });
    }
    start();
  }

  /* A full-screen colour wash — damage, level clear, a fatal mistake. */
  function flash(colour, ms) {
    const el = document.getElementById('fx-flash');
    if (!el) return;
    el.style.background = colour;
    el.classList.remove('is-on');
    void el.offsetWidth;
    el.style.setProperty('--flash-ms', (ms || 320) + 'ms');
    el.classList.add('is-on');
  }

  return { init, burst, at, confetti, place, flash, resize };
})();


/* ===== js/backdrop.js ===== */
'use strict';

/* The animated scene behind every screen.

   Each skin gets its own weather: sun and drifting petals for the pet rescue,
   cave dust for the original, rising embers in the nether, falling ash and
   lightning in sudden death. It is a slow, low-contrast layer — atmosphere,
   never competition for the question in the middle of the screen. */
const Backdrop = (function () {

  let canvas = null;
  let ctx = null;
  let motes = [];
  let skin = 'zoo';
  let frame = 0;
  let raf = null;
  let reduced = false;

  const THEMES = {
    /* A sunny meadow: warm sky, drifting pollen and petals. Nothing dark and
       nothing fast — this sits behind a three-year-old's first letters. */
    zoo: {
      sky: ['#9fd8f2', '#d7f0c2'],
      mote: ['#ffffff', '#ffe9a8', '#bdf2a0', '#ffd0e0'],
      count: 30, drift: 0.4, fall: 0.2, size: [5, 11], glow: 'rgba(255,246,200,0.40)'
    },
    easy: {
      sky: ['#8fd0f0', '#c9ecb8'],
      mote: ['#ffffff', '#ffe9a8', '#b6ff8a'],
      count: 34, drift: 0.35, fall: 0.22, size: [4, 9], glow: 'rgba(255,240,170,0.30)'
    },
    normal: {
      sky: ['#2a2a30', '#17151a'],
      mote: ['#cfc7b4', '#9a907c'],
      count: 26, drift: 0.12, fall: 0.16, size: [3, 6], glow: 'rgba(255,214,120,0.10)'
    },
    hard: {
      sky: ['#2a0f10', '#0e0708'],
      mote: ['#ff8a3c', '#ffd06a', '#c0331c'],
      count: 40, drift: 0.18, fall: -0.5, size: [3, 7], glow: 'rgba(255,110,40,0.20)'
    },
    sudden: {
      sky: ['#2b0509', '#080203'],
      mote: ['#ff3b3b', '#8a1414', '#d0d0d0'],
      count: 46, drift: 0.3, fall: 0.6, size: [3, 8], glow: 'rgba(255,40,40,0.18)'
    }
  };

  function theme() { return THEMES[skin] || THEMES.zoo; }

  function seed() {
    const t = theme();
    motes = [];
    for (let i = 0; i < t.count; i++) motes.push(spawn(t, true));
  }

  function spawn(t, anywhere) {
    const depth = 0.35 + Math.random() * 0.65;      // parallax: far motes drift slower
    return {
      x: Math.random() * window.innerWidth,
      y: anywhere ? Math.random() * window.innerHeight
        : (t.fall < 0 ? window.innerHeight + 10 : -10),
      depth: depth,
      size: (t.size[0] + Math.random() * (t.size[1] - t.size[0])) * depth,
      colour: t.mote[(Math.random() * t.mote.length) | 0],
      phase: Math.random() * Math.PI * 2,
      alpha: 0.25 + Math.random() * 0.5
    };
  }

  function resize() {
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function draw() {
    const t = theme();
    const w = window.innerWidth, h = window.innerHeight;
    frame++;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, t.sky[0]);
    sky.addColorStop(1, t.sky[1]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // A soft light source, drifting slowly, that gives the flat gradient depth.
    const gx = w * (0.5 + 0.22 * Math.sin(frame / 900));
    const glow = ctx.createRadialGradient(gx, h * 0.28, 0, gx, h * 0.28, h * 0.85);
    glow.addColorStop(0, t.glow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    for (const m of motes) {
      m.phase += 0.012;
      m.x += Math.sin(m.phase) * t.drift * m.depth;
      m.y += t.fall * m.depth;
      if (m.y > h + 20 || m.y < -20) Object.assign(m, spawn(t, false));
      if (m.x < -20) m.x = w + 20;
      if (m.x > w + 20) m.x = -20;

      ctx.globalAlpha = m.alpha * m.depth;
      ctx.fillStyle = m.colour;
      ctx.fillRect(m.x | 0, m.y | 0, m.size | 0, m.size | 0);
    }
    ctx.globalAlpha = 1;

    // Sudden death gets the occasional lightning crack across the sky.
    if (skin === 'sudden' && Math.random() < 0.004) {
      ctx.fillStyle = 'rgba(255,70,70,0.10)';
      ctx.fillRect(0, 0, w, h);
    }

    raf = requestAnimationFrame(draw);
  }

  function setSkin(id) {
    skin = id || 'zoo';
    if (ctx) { seed(); if (reduced) still(); }
  }

  /* One painted frame, for viewers who asked for no motion. */
  function still() {
    const t = theme();
    const w = window.innerWidth, h = window.innerHeight;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, t.sky[0]);
    sky.addColorStop(1, t.sky[1]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);
  }

  function init() {
    canvas = document.getElementById('backdrop');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    reduced = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    window.addEventListener('resize', resize);
    if (reduced) still();
    else raf = requestAnimationFrame(draw);
  }

  return { init, setSkin, stop: () => raf && cancelAnimationFrame(raf) };
})();


/* ===== js/speech.js ===== */
'use strict';

/* Speaking the question aloud.

   The audience cannot read, so the spoken cue *is* the question — the picture
   and the letter shapes are support. Uses the browser's own speech synthesis:
   no audio files, nothing to download, works offline once a voice is installed.

   Getting Czech out of a browser goes wrong in three different ways, and they
   need three different answers:

     1. the machine has no Czech voice, so an English one reads Czech
        -> respell the text for it (`romanize`), and tell the parent how to
           install a real one
     2. the machine has several, and the one picked automatically is the bad
        one (eSpeak, a "compact" voice, a novelty voice)
        -> score on quality as well as language, and demote the known-bad
     3. the parent disagrees with the pick, or wants the other Czech voice
        -> let them choose it, hear it, and have the choice remembered

   Voices are not guaranteed at all. Where there is none, the game still works:
   every question is answerable from the picture and the letter shapes alone,
   and the replay button simply does nothing rather than appearing broken. */
const Speech = (function () {

  const PIN_KEY = 'a-z-app.voice.';            // + the language tag

  /* Per language: the voices to reach for, the ones to push away, and how fast
     and how high to speak. Named voices are the ones that actually ship —
     Windows, macOS/iOS and Chrome each call the same accent something else. */
  const PROFILES = {
    'en-GB': {
      // A male UK voice: lower, slower and easier for small ears than the
      // bright female default most systems pick first.
      want: [
        /google uk english male/i,
        /\b(daniel|arthur|george|ryan|oliver|graham|malcolm|rishi)\b/i,
        /\bmale\b/i
      ],
      avoid: /\b(female|serena|kate|stephanie|amy|emma|libby|sonia|hazel|martha|susan|fiona|moira|karen)\b/i,
      rate: 0.85,
      pitch: 0.95                                 // a man's voice, not a cartoon
    },
    'cs-CZ': {
      // Microsoft Jakub and Vít (Windows), Zuzana (Apple), and Google's Czech
      // voice on Android are the ones worth having. Everything Czech beats
      // everything English, but among Czech voices these are the good ones.
      want: [
        /\b(jakub|vít|vit|antonín|antonin)\b/i,
        /\bgoogle\b/i,
        /\b(zuzana|iveta|laura|vlasta)\b/i,
        /\bmale\b/i
      ],
      avoid: null,
      rate: 0.82,                                 // Czech words are longer
      pitch: 1.0
    }
  };

  const DEFAULT_PROFILE = { want: [], avoid: null, rate: 0.85, pitch: 1.05 };

  /* Modern neural voices are a different class from the old concatenative
     ones, and the old ones are what makes Czech sound like a robot reading
     out loud. Worth a lot; never worth more than speaking the language. */
  const GOOD_ENGINE = /\b(natural|neural|online|premium|enhanced|siri)\b/i;

  /* eSpeak (Chrome on Linux, some Android builds) and Apple's novelty voices
     are genuinely unusable for a child, and both really do show up in the
     list — eSpeak even claims cs-CZ. */
  const BAD_ENGINE = /\b(espeak|compact|eloquence|novelty|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|grandma|grandpa|rocko|shelley|sandy|flo|eddy|reed|rishi)\b/i;

  let enabled = true;
  let lang = 'cs-CZ';
  let romanize = null;          // how to respell this language for a foreign voice
  let voice = null;
  let matched = false;          // true when the voice really speaks `lang`
  let pinnedName = null;        // what the parent chose, if anything

  function supported() {
    return typeof window !== 'undefined' && 'speechSynthesis' in window;
  }

  function profile() { return PROFILES[lang] || DEFAULT_PROFILE; }

  function base(code) { return String(code || '').slice(0, 2).toLowerCase(); }

  function all() {
    if (!supported()) return [];
    try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
  }

  function speaksLang(v) {
    const vl = String(v.lang || '').replace('_', '-');
    return vl.toLowerCase() === lang.toLowerCase() || base(vl) === base(lang);
  }

  /* Highest score wins. Language outranks everything — a perfect-sounding
     English gentleman reading Czech is worse than any Czech voice at all —
     and engine quality outranks which particular person it is. */
  function score(v) {
    const p = profile();
    const vl = String(v.lang || '').replace('_', '-');
    let s = 0;
    if (vl.toLowerCase() === lang.toLowerCase()) s += 1000;
    else if (base(vl) === base(lang)) s += 500;
    else return -1;                                // wrong language: unusable

    const name = String(v.name || '');
    if (GOOD_ENGINE.test(name)) s += 200;
    if (BAD_ENGINE.test(name)) s -= 400;           // worse than the wrong accent
    p.want.forEach((re, i) => { if (re.test(name)) s += 100 - i * 10; });
    if (p.avoid && p.avoid.test(name)) s -= 60;
    if (v.localService) s += 15;                   // installed voices do not stall
    if (v.default) s += 5;
    return s;
  }

  function pickVoice() {
    const voices = all();
    if (!voices.length) return null;

    // A voice the parent chose outranks anything this file believes.
    if (pinnedName) {
      const chosen = voices.find((v) => v.name === pinnedName);
      if (chosen) { matched = speaksLang(chosen); return chosen; }
    }

    let best = null, bestScore = -1;
    voices.forEach((v) => {
      const s = score(v);
      if (s > bestScore) { bestScore = s; best = v; }
    });

    if (best) { matched = true; return best; }

    // Nothing in the right language. Speak anyway with the least-bad voice we
    // have and respell the words for it: an approximate "Beruška" still beats
    // silence for a child who cannot read.
    matched = false;
    const usable = voices.filter((v) => !BAD_ENGINE.test(String(v.name || '')));
    const pool = usable.length ? usable : voices;
    return pool.find((v) => v.default) || pool[0];
  }

  function loadPin() {
    try { pinnedName = localStorage.getItem(PIN_KEY + lang) || null; }
    catch (e) { pinnedName = null; }
  }

  function refresh() { voice = pickVoice(); }

  function init() {
    if (!supported()) return;
    loadPin();
    refresh();
    // Chrome populates the list asynchronously, and may repopulate it later.
    window.speechSynthesis.onvoiceschanged = refresh;
  }

  /* Called when the alphabet pack changes: the voice follows the language, and
     so does the respelling used when no voice speaks it.
       opts.romanize  (text) => text, respelled for a voice of another language */
  function setLang(code, opts) {
    const o = opts || {};
    if (o.romanize !== undefined) romanize = o.romanize;
    if (!code || code === lang) return;
    lang = code;
    if (supported()) { window.speechSynthesis.cancel(); loadPin(); refresh(); }
  }

  /* The voices a parent may choose between, best first, each marked with
     whether it can actually speak the current language. */
  function list() {
    return all()
      .map((v) => ({
        name: v.name,
        lang: String(v.lang || '').replace('_', '-'),
        speaksLang: speaksLang(v),
        poor: BAD_ENGINE.test(String(v.name || '')),
        score: score(v)
      }))
      .sort((a, b) => (b.speaksLang - a.speaksLang) || (b.score - a.score) ||
                       a.name.localeCompare(b.name));
  }

  /* name === null goes back to choosing automatically. */
  function setVoiceByName(name) {
    pinnedName = name || null;
    try {
      if (pinnedName) localStorage.setItem(PIN_KEY + lang, pinnedName);
      else localStorage.removeItem(PIN_KEY + lang);
    } catch (e) { /* storage may be blocked; the choice just will not stick */ }
    if (supported()) window.speechSynthesis.cancel();
    refresh();
  }

  /* True only when we know the reader and know it cannot speak this language. */
  function foreignVoice() { return !!voice && !matched && !!romanize; }

  function say(text, opts) {
    if (!enabled || !supported() || !text) return;
    const o = opts || {};
    const p = profile();
    // A voice that cannot speak this language gets the words respelled the way
    // it would have to read them to come out close. Only what is *spoken*
    // changes — never what is on the screen.
    //
    // This needs a voice we can actually see. An empty voice list means the
    // engine will choose for itself (Chrome, before the list loads) and it may
    // well choose a Czech one — respelling then makes it worse, not better.
    const spoken = foreignVoice() ? romanize(text) : text;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(spoken);
      if (voice) u.voice = voice;
      // Claim the language only when the voice can back it up: telling an
      // English engine that "berooshka" is Czech makes it worse, not better.
      u.lang = foreignVoice() ? voice.lang : lang;
      u.rate = o.rate == null ? p.rate : o.rate;   // slow: they are three
      u.pitch = o.pitch == null ? p.pitch : o.pitch;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch (e) { /* a missing or blocked voice must never break the game */ }
  }

  return {
    init,
    say,
    setLang,
    list,
    setVoiceByName,
    available: () => supported() && !!voice,
    /* Whether the voice actually speaks the pack's language — the UI can say
       so instead of leaving a parent wondering why Czech sounds English. */
    matchesLanguage: () => matched,
    voiceName: () => (voice ? voice.name : ''),
    isPinned: () => !!pinnedName,
    /* What a given piece of text will really be sent to the engine as. Exposed
       so the respelling can be tested rather than only heard. */
    spokenForm: (text) => (foreignVoice() ? romanize(text) : text),
    setEnabled(v) { enabled = v; if (!v && supported()) window.speechSynthesis.cancel(); },
    isEnabled: () => enabled
  };
})();


/* ===== js/audio.js ===== */
'use strict';

/* Sound engine.

   The original was one bare oscillator per beep. This is a small synth: a
   master chain with compression and a generated reverb, noise percussion for
   impacts, envelopes with real attack and decay, and pitch slides. Still not a
   single audio file — everything is generated, so the game stays tiny and
   works offline.

   Each skin gets its own voice. The pet rescue is soft triangles and sine
   pads; sudden death is a hard sawtooth with grit. Same events, different
   character — so the mode you picked is audible, not just visible. */
const Sfx = (function () {

  let ctx = null;
  let master = null;
  let reverbSend = null;
  let noiseBuffer = null;
  let muted = false;
  let skin = 'zoo';

  /* One voice, deliberately soft. The audience is three: triangles and sines,
     no grit, a generous room. Nothing here should ever startle. */
  const VOICES = {
    zoo: { lead: 'triangle', bass: 'sine', grit: 0.0, bright: 1.15, room: 0.34 }
  };

  function voice() { return VOICES[skin] || VOICES.zoo; }

  /* A short, bright impulse response — enough to put the sounds in a space
     without the boxy ring of a naive delay. */
  function buildReverb(ac) {
    const seconds = 1.1;
    const len = Math.floor(ac.sampleRate * seconds);
    const impulse = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const data = impulse.getChannelData(c);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
      }
    }
    const convolver = ac.createConvolver();
    convolver.buffer = impulse;
    return convolver;
  }

  function buildNoise(ac) {
    const len = Math.floor(ac.sampleRate * 0.6);
    const buffer = ac.createBuffer(1, len, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function ensure() {
    if (!ctx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      ctx = new Ctor();

      master = ctx.createGain();
      master.gain.value = 0.5;

      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.18;

      const wet = ctx.createGain();
      wet.gain.value = voice().room;
      reverbSend = wet;
      const verb = buildReverb(ctx);

      master.connect(comp);
      comp.connect(ctx.destination);
      master.connect(wet);
      wet.connect(verb);
      verb.connect(ctx.destination);

      noiseBuffer = buildNoise(ctx);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /* One synth voice: oscillator + optional detuned twin, filter, envelope. */
  function tone(opts) {
    if (muted) return;
    const ac = ensure();
    if (!ac) return;
    const v = voice();
    const o = opts || {};
    const t0 = ac.currentTime + (o.delay || 0);
    const dur = o.dur || 0.16;
    const peak = (o.vol == null ? 0.16 : o.vol);

    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + (o.attack || 0.008));
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime((o.cutoff || 4200) * v.bright, t0);
    filter.Q.value = o.q || 1;

    const makeOsc = (detune) => {
      const osc = ac.createOscillator();
      osc.type = o.type || v.lead;
      osc.detune.value = detune;
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + dur);
      osc.connect(filter);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    };

    makeOsc(0);
    if (v.grit > 0) makeOsc(v.grit * 60);        // a slightly detuned twin adds bite

    filter.connect(gain);
    gain.connect(master);
  }

  /* Filtered noise: thuds, clangs, impacts. */
  function hit(opts) {
    if (muted) return;
    const ac = ensure();
    if (!ac || !noiseBuffer) return;
    const o = opts || {};
    const t0 = ac.currentTime + (o.delay || 0);
    const dur = o.dur || 0.12;

    const src = ac.createBufferSource();
    src.buffer = noiseBuffer;

    const filter = ac.createBiquadFilter();
    filter.type = o.filter || 'bandpass';
    filter.frequency.setValueAtTime(o.freq || 900, t0);
    if (o.to) filter.frequency.exponentialRampToValueAtTime(Math.max(40, o.to), t0 + dur);
    filter.Q.value = o.q == null ? 1.2 : o.q;

    const gain = ac.createGain();
    gain.gain.setValueAtTime(o.vol == null ? 0.2 : o.vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(filter); filter.connect(gain); gain.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  /* A run of notes. Semitones above a root, played in sequence. */
  function run(root, steps, opts) {
    const o = opts || {};
    steps.forEach((semi, i) => {
      tone({
        freq: root * Math.pow(2, semi / 12),
        dur: o.dur || 0.16,
        vol: o.vol == null ? 0.15 : o.vol,
        delay: (o.delay || 0) + i * (o.gap || 0.07),
        type: o.type,
        cutoff: o.cutoff
      });
    });
  }

  return {
    setSkin(id) {
      skin = id || 'normal';
      if (reverbSend) reverbSend.gain.value = voice().room;
    },
    toggleMute() { muted = !muted; return muted; },
    isMuted() { return muted; },

    click() {
      tone({ freq: 520, dur: 0.06, vol: 0.08, cutoff: 3000, type: 'triangle' });
    },

    /* Right answer: a warm rising third, then an octave above. Praise, not
       a scoreboard noise. */
    correct() {
      run(523.25, [0, 4, 7], { dur: 0.2, gap: 0.075, vol: 0.13, type: 'triangle' });
      tone({ freq: 1046.5, dur: 0.4, vol: 0.09, delay: 0.2, cutoff: 6000, type: 'sine' });
    },

    /* Wrong answer: a soft two-note "mm-mm", the sound of a person shaking
       their head kindly. No buzzer — nothing is lost here. */
    nudge() {
      tone({ freq: 330, dur: 0.14, vol: 0.09, type: 'sine', cutoff: 1800 });
      tone({ freq: 294, dur: 0.18, vol: 0.09, delay: 0.13, type: 'sine', cutoff: 1800 });
    },

    /* An animal arriving home. */
    join() {
      run(392, [0, 7, 12], { dur: 0.24, gap: 0.09, vol: 0.1, type: 'triangle' });
    },

    /* The zoo filling up. */
    fanfare() {
      run(523.25, [0, 4, 7, 12, 16], { dur: 0.26, gap: 0.12, vol: 0.13, type: 'triangle' });
      tone({ freq: 2093, dur: 0.9, vol: 0.08, delay: 0.62, cutoff: 8000, type: 'sine' });
    },

    tick() { tone({ freq: 1200, dur: 0.035, vol: 0.06, cutoff: 5000, type: 'square' }); },

    /* Battle beats, used by the sudden-death clip. */
    charge() {
      tone({ freq: 110, to: 440, dur: 0.5, vol: 0.16, cutoff: 2400 });
      hit({ freq: 200, to: 2000, dur: 0.5, vol: 0.08, q: 0.5 });
    },
    finish() {
      hit({ freq: 3000, to: 400, dur: 0.3, vol: 0.3, q: 0.7 });
      tone({ freq: 140, to: 46, dur: 0.7, vol: 0.24, cutoff: 1600 });
      run(261.63, [0, 7, 12], { dur: 0.3, gap: 0.1, vol: 0.14, delay: 0.12 });
    }
  };
})();

    'stats.summary': (p) => p.seen + ' z ' + p.total + ' písmenek vyzkoušeno · ' +
      p.mastered + ' už umíš',
    'stats.hint': 'Hra se častěji ptá na ta červená.',
    'stats.unseen': 'nezkoušeno',
    'stats.learning': 'učím se',
    'stats.shaky': 'chce trénink',
    'stats.mastered': 'umím',
    'stats.reset': 'ZAČÍT ZNOVU',
    'stats.cleared': 'Smazáno. Začínáme znovu!',
    'stats.weakest': 'Ještě záludná'
  };

  const DICT = { en: EN, cs: CS };
  const LANGS = [{ id: 'cs', label: 'CZ' }, { id: 'en', label: 'EN' }];
  let lang = 'cs';

  function detect() {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && DICT[saved]) return saved;
    } catch (e) { /* storage may be blocked */ }
    // Czech is the pack this app is built around, so Czech is what it opens
    // in — on a Czech laptop, an English one, or a school tablet set to
    // anything at all. The system language is not consulted: a Czech child on
    // an English-configured machine is exactly the case that matters, and the
    // choice is one tap away and remembered from then on.
    return 'cs';
  }

  function t(key, params) {
    const entry = DICT[lang][key] != null ? DICT[lang][key] : EN[key];
    if (entry == null) return key;
    if (typeof entry === 'function') return entry(params || {});
    if (!params) return entry;
    return entry.replace(/\{(\w+)\}/g, (whole, name) =>
      params[name] != null ? params[name] : whole);
  }

  function apply() {
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });
  }

  return {
    t, apply, langs: LANGS,
    get: () => lang,
    setLang(next) {
      if (!DICT[next]) return;
      lang = next;
      try { localStorage.setItem(LANG_KEY, next); } catch (e) { /* ignore */ }
      document.documentElement.lang = next;
      apply();
    },
    init() { lang = detect(); document.documentElement.lang = lang; }
  };
})();


/* ===== js/progress.js ===== */
'use strict';

/* Per-letter mastery.

   Same idea as the times-tables version, keyed by letter instead of by fact.
   The record does two jobs: it decides which letter comes up next, and it is
   shown to the child and the grown-up on the MY LETTERS screen. Tracking
   nobody can see may as well not exist. */
const Progress = (function () {

  const KEY = 'a-z-app.progress';
  const RECENT_LIMIT = 4;
  const MASTERY_STREAK = 3;

  let letters = load();
  const recent = [];

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      return raw && typeof raw === 'object' ? raw : {};
    } catch (e) { return {}; }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(letters)); }
    catch (e) { /* private browsing — tracking is best effort */ }
  }

  function get(letter) { return letters[letter] || null; }

  function record(letter, isCorrect) {
    const f = letters[letter] || (letters[letter] = { seen: 0, correct: 0, wrong: 0, streak: 0 });
    f.seen++;
    if (isCorrect) { f.correct++; f.streak++; } else { f.wrong++; f.streak = 0; }
    save();
  }

  function level(letter) {
    const f = get(letter);
    if (!f || f.seen === 0) return 'unseen';
    const accuracy = f.correct / f.seen;
    if (f.streak >= MASTERY_STREAK && accuracy >= 0.7) return 'mastered';
    if (accuracy < 0.6 || f.streak === 0) return 'shaky';
    return 'learning';
  }

  function weight(letter) {
    const f = get(letter);
    if (!f || f.seen === 0) return 2.5;          // unseen beats solid: coverage
    const accuracy = f.correct / f.seen;
    let w = 0.6 + 4 * (1 - accuracy);
    if (f.streak >= MASTERY_STREAK) w *= 0.35;   // known: rest it
    else if (f.streak === 0) w += 1.5;           // just missed: jump the queue
    return Math.max(0.15, w);
  }

  /* Weighted draw, holding back the few just asked so weighting never
     degenerates into the same letter twice running. */
  function pickLetter(pool) {
    const candidates = pool.filter((l) => recent.indexOf(l) === -1);
    const list = candidates.length ? candidates : pool;
    let total = 0;
    const acc = list.map((l) => { total += weight(l); return { l, acc: total }; });
    const roll = Math.random() * total;
    const hit = acc.find((c) => roll <= c.acc) || acc[acc.length - 1];
    recent.push(hit.l);
    while (recent.length > RECENT_LIMIT) recent.shift();
    return hit.l;
  }

  function weakest(limit, pool) {
    return pool
      .map((l) => ({ letter: l, f: get(l), level: level(l) }))
      .filter((x) => x.f && x.f.wrong)
      .sort((a, b) => (b.f.wrong - a.f.wrong) || (b.f.seen - a.f.seen))
      .slice(0, limit);
  }

  function summary(pool) {
    let seen = 0, mastered = 0;
    pool.forEach((l) => {
      const f = get(l);
      if (f && f.seen) seen++;
      if (level(l) === 'mastered') mastered++;
    });
    return { seen, mastered, total: pool.length };
  }

  function reset() { letters = {}; recent.length = 0; save(); }

  return { record, level, weight, pickLetter, weakest, summary, reset, get };
})();

'use strict';

/* Alphabet packs.

   Czech is not a translation of the English pack — it is a different alphabet
   with a constraint English does not have: **most Czech letters cannot start a
   word at all.** Á, É, Í, Ó, Ú, Ů, Ý and Ě never begin one; Ď, Ň, Ť and Y
   effectively never do; Q, W and X only appear in borrowed words. Asking "what
   does Ů start with?" is not a hard question, it is an impossible one.

   So a pack separates two things:

     letters   the whole alphabet, for matching capitals to small letters and
               for putting letters in order — every letter belongs here
     words     only the letters that really can begin a word, for the two
               question types that start from a picture or a sound

   Czech letter *names* are also given explicitly where a speech synthesiser
   would otherwise stumble: CH is one letter said "chá", and the long vowels
   are taught to Czech children as "dlouhé á", which is exactly what a child
   needs to hear. */

    id: 'cs',
