/* Czech is the preferred pack, so it is the one a fresh install starts on. */
let pack = PACKS.cs;

function setPack(id) { pack = PACKS[id] || PACKS.cs; }
function currentPack() { return pack; }

function alphabet() { return pack.letters; }
function wordFor(letter) { return pack.words[letter] || null; }
function spriteFor(letter) { const w = wordFor(letter); return w ? w.sprite : null; }
function hasWord(letter) { return !!pack.words[letter]; }
function confusableFor(letter) { return pack.confusable[letter] || []; }

/* How to say a letter out loud: an explicit name where one is given, the
   letter itself otherwise. */
function sayLetter(letter) { return pack.letterSay[letter] || letter; }

/* A spoken sentence in the pack's own language. Never build one by gluing
   translated fragments together: the glue is the part that sounds foreign. */
function phrase(name, letter) {
  const build = pack.phrases[name];
  if (!build) return '';
  const said = sayLetter(letter);
  return name === 'order' ? build()
       : (name === 'letters' || name === 'justLetter') ? build(said)
       : build(wordFor(letter) || { say: said }, said);
}

function voiceLang() { return pack.voiceLang; }

/* How this pack's text must be respelled for a voice of another language, or
   null where nothing useful can be done. */
function romanizer() { return pack.romanize || null; }

/* One line for the parent to judge a voice by — it carries the sounds that
   separate a real Czech voice from an English one pretending. */
function sampleLine() {
  const build = pack.phrases.sample;
  return build ? build() : '';
}

/* The letters a level works with, and — separately — those of them that can
   front a word. The two picture-based question types can only use the second
   list; matching and ordering can use the whole pool. */
function poolFor(levelId) {
  const pool = pack.pools[levelId];
  return pool ? pool.filter((l) => pack.letters.indexOf(l) !== -1) : pack.letters;
}

function wordPoolFor(levelId) { return poolFor(levelId).filter(hasWord); }

const LEVELS = [
  { id: 'first',    choices: 3, types: ['sound', 'picture'],                   lower: false, collectTarget: 6 },
  { id: 'bigsmall', choices: 4, types: ['sound', 'picture', 'case'],           lower: true,  collectTarget: 8 },
  { id: 'alphabet', choices: 5, types: ['sound', 'picture', 'case', 'order'],  lower: true,  collectTarget: 10 }
];

const DEFAULT_LEVEL = 'first';


/* ===== js/questions.js ===== */
'use strict';

/* Question generation.

   Four kinds, all answered by tapping — nothing here needs reading or typing:

     sound    a picture, spoken aloud   -> tap the letter it starts with
     picture  a letter, spoken aloud    -> tap the animal that starts with it
     case     a capital letter          -> tap the matching small letter
     order    A B _ D                   -> tap the letter that is missing

   Wrong options are chosen from letters children genuinely confuse (b/d/p,
   m/n/w, i/j/l in English; the háčky and the length marks in Czech). Random
   wrong answers would let a child pattern-match their way through without ever
   looking at the letter.

   Everything here works off the current alphabet pack, and the pack decides
   what is even askable. Czech has letters that cannot begin a word — asking
   what Ů starts with is not a hard question, it is an impossible one — so a
   letter is asked only in the kinds it can honestly support. */
const Questions = (function () {

  const rnd = (n) => Math.floor(Math.random() * n);

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = rnd(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* Tempting wrong letters first, then neighbours in the alphabet, then any
     other letter of the pool. The pool is passed in because a picture question
     can only offer letters that actually have an animal to show. */
  function distractorLetters(letter, count, pool) {
    const list = pool && pool.length ? pool : alphabet();
    const out = [];
    const seen = new Set([letter]);
    const take = (l) => {
      if (l && !seen.has(l) && list.indexOf(l) !== -1) { seen.add(l); out.push(l); }
    };

    shuffle(confusableFor(letter)).forEach(take);

    const i = list.indexOf(letter);
    shuffle([i - 1, i + 1, i - 2, i + 2]).forEach((j) => take(list[j]));

    let guard = 0;
    while (out.length < count && guard++ < 400) take(list[rnd(list.length)]);
    return out.slice(0, count);
  }

  /* Which kinds this letter can carry, in this level. */
  function typesFor(level, letter, wordPool) {
    return level.types.filter((type) => {
      if (type === 'sound') return hasWord(letter);
      // A picture question needs one animal per tile, not just for the answer.
      if (type === 'picture') return hasWord(letter) && wordPool.length >= level.choices;
      return true;
    });
  }

  function make(level, letter) {
    const pool = poolFor(level.id);
    const wordPool = wordPoolFor(level.id);
    const usable = typesFor(level, letter, wordPool);
    const type = usable.length ? usable[rnd(usable.length)] : 'case';
    const word = wordFor(letter);

    if (type === 'picture') {
      const wrong = distractorLetters(letter, level.choices - 1, wordPool);
      return {
        type: 'picture',
        letter: letter,
        say: phrase('picture', letter),
        cueLetter: letter,
        options: shuffle([letter].concat(wrong)).map((l) => ({
          value: l, sprite: spriteFor(l), correct: l === letter
        })),
        optionKind: 'sprite'
      };
    }

    if (type === 'case') {
      const wrong = distractorLetters(letter, level.choices - 1, pool);
      return {
        type: 'case',
        letter: letter,
        say: phrase('letters', letter),
        cueLetter: letter,
        options: shuffle([letter].concat(wrong)).map((l) => ({
          value: l, label: l.toLowerCase(), correct: l === letter
        })),
        optionKind: 'letter'
      };
    }

    if (type === 'order') {
      const wrong = distractorLetters(letter, level.choices - 1, pool);
      const i = pool.indexOf(letter);
      // A window of four with this letter hidden, kept inside the alphabet.
      const start = Math.max(0, Math.min(pool.length - 4, i - rnd(4)));
      const window = pool.slice(start, start + 4);
      return {
        type: 'order',
        letter: letter,
        say: phrase('order', letter),
        sequence: window.map((l) => (l === letter ? null : l)),
        options: shuffle([letter].concat(wrong)).map((l) => ({
          value: l, label: l, correct: l === letter
        })),
        optionKind: 'letter'
      };
    }

    const wrong = distractorLetters(letter, level.choices - 1, pool);
    return {
      type: 'sound',
      letter: letter,
      say: phrase('sound', letter),
      cueSprite: word.sprite,
      cueWord: word.say,
      options: shuffle([letter].concat(wrong)).map((l) => ({
        value: l, label: level.lower && Math.random() < 0.4 ? l.toLowerCase() : l,
        correct: l === letter
      })),
      optionKind: 'letter'
    };
  }

  return { make, distractorLetters, typesFor };
})();


/* ===== js/game.js ===== */
'use strict';

/* A-Z App — state machine.

   The loop: a cue appears and is spoken aloud, the child taps a big tile, and
   a correct tap brings an animal home to the zoo. There are no lives and no
   game over — a wrong tap wobbles, says "try another one", and leaves the
   question up. For a three-year-old a failure screen teaches the wrong lesson;
   the only thing that should ever be at stake is how full the zoo is. */

(function () {

  const $ = (id) => document.getElementById(id);
  const t = (key, params) => I18n.t(key, params);

  const LEVEL_KEY = 'a-z-app.level';
  const ZOO_KEY = 'a-z-app.zoo';

  const state = {
    levelId: DEFAULT_LEVEL,
    current: null,
    locked: false,
    missedThisQuestion: false,
    zoo: [],                 // letters brought home in the current zoo
    collected: {},           // every letter ever brought home
    soundOn: true,
    voiceOn: true
  };

  function level() {
    return LEVELS.find((l) => l.id === state.levelId) || LEVELS[0];
  }

  /* Not every letter has an animal. Czech Ď, Ň, Ť and the long vowels cannot
     begin a word, so they are still learned and still collected — they just
     show as the letter itself rather than as an empty picture frame. */
  function paintFace(el, letter, picClass) {
    const sprite = spriteFor(letter);
    if (sprite) {
      Sprites.paint(el, sprite);
      el.className += ' ' + picClass;
    } else {
      el.className = picClass + ' face-letter';
      el.textContent = letter;
    }
    return el;
  }

  /* ---------------------------------------------------------- screens */

  function show(id) {
    document.querySelectorAll('.screen').forEach((s) => {
      s.classList.toggle('is-active', s.id === id);
    });
  }

  let toastTimer = null;
  function toast(message) {
    const el = $('toast');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2000);
  }

  /* ---------------------------------------------------------- storage */

  function loadJson(key, fallback) {
    try {
      const raw = JSON.parse(localStorage.getItem(key));
      return raw == null ? fallback : raw;
    } catch (e) { return fallback; }
  }

  function saveJson(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  /* ---------------------------------------------------------- the zoo */

  function renderZoo() {
    const strip = $('zoo-strip');
    strip.innerHTML = '';
    const target = level().collectTarget;
    for (let i = 0; i < target; i++) {
      const slot = document.createElement('div');
      slot.className = 'zoo-slot';
      const letter = state.zoo[i];
      if (letter) {
        slot.classList.add('is-home');
        slot.appendChild(paintFace(document.createElement('span'), letter, 'zoo-pic'));
        const tag = document.createElement('b');
        tag.textContent = letter;
        slot.appendChild(tag);
      }
      strip.appendChild(slot);
    }
    $('zoo-count').textContent = t('ui.zooCount', { n: state.zoo.length, total: target });
  }

  /* ------------------------------------------------------- questions */

  function nextQuestion() {
    state.current = Questions.make(level(), Progress.pickLetter(poolFor(state.levelId)));
    state.locked = false;
    state.missedThisQuestion = false;
    renderQuestion();
    speakCue();
  }

  function speakCue() {
    if (state.current) Speech.say(state.current.say);
  }

  function renderQuestion() {
    const q = state.current;
    $('feedback').hidden = true;
    $('quest-kind').textContent = t('q.' + q.type);

    const cue = $('cue');
    cue.innerHTML = '';
    cue.className = 'cue cue--' + q.type;

    if (q.type === 'sound') {
      const pic = document.createElement('div');
      Sprites.paint(pic, q.cueSprite);
      pic.className += ' cue-pic';
      cue.appendChild(pic);
      const word = document.createElement('div');
      word.className = 'cue-word';
      word.textContent = q.cueWord;
      cue.appendChild(word);
    } else if (q.type === 'order') {
      const row = document.createElement('div');
      row.className = 'cue-seq';
      q.sequence.forEach((l) => {
        const cell = document.createElement('span');
        cell.className = 'seq-cell' + (l ? '' : ' is-gap');
        cell.textContent = l || '?';
        row.appendChild(cell);
      });
      cue.appendChild(row);
    } else {
      const big = document.createElement('div');
      big.className = 'cue-letter';
      big.textContent = q.cueLetter;
      cue.appendChild(big);
    }

    const box = $('options');
    box.innerHTML = '';
    box.className = 'options options--' + q.optionKind + ' options--n' + q.options.length;
    q.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt opt--' + q.optionKind;
      btn.dataset.value = opt.value;
      btn.dataset.correct = opt.correct ? '1' : '0';
      if (q.optionKind === 'sprite') {
        const pic = document.createElement('span');
        Sprites.paint(pic, opt.sprite);
        pic.className += ' opt-pic';
        btn.appendChild(pic);
      } else {
        btn.textContent = opt.label;
      }
      btn.addEventListener('click', () => choose(opt, btn));
      box.appendChild(btn);
    });
  }

  function choose(opt, btn) {
    if (state.locked) return;

    if (!opt.correct) {
      // Nothing is lost. The tile refuses, the game says try another, and the
      // question stays exactly where it was.
      if (!state.missedThisQuestion) {
        Progress.record(state.current.letter, false);
        state.missedThisQuestion = true;
      }
      btn.classList.add('is-wrong');
      btn.disabled = true;
      Sfx.nudge();
      Fx.at(btn, { palette: 'ash', count: 8, power: 3 });
      toast(t('fb.tryAgain'));
      return;
    }

    state.locked = true;
    btn.classList.add('is-right');
    document.querySelectorAll('#options .opt').forEach((b) => { b.disabled = true; });

    if (!state.missedThisQuestion) Progress.record(state.current.letter, true);

    const letter = state.current.letter;
    const word = wordFor(letter);
    Sfx.correct();
    Fx.at(btn, { palette: 'good', count: 26, power: 7, lift: 3 });
    Speech.say(phrase(word ? 'praise' : 'justLetter', letter));

    const isNew = state.zoo.indexOf(letter) === -1;
    if (isNew) {
      state.zoo.push(letter);
      state.collected[letter] = true;
      saveJson(ZOO_KEY, { zoo: state.zoo, collected: state.collected });
      renderZoo();
      Fx.at($('zoo-strip'), { palette: 'gold', count: 18, power: 5, lift: 2 });
    }

    showFeedback(letter, word, isNew);
  }

  function showFeedback(letter, word, isNew) {
    const fb = $('feedback');
    $('fb-head').textContent = t('fb.yes');
    $('fb-line').textContent = word
      ? t('fb.yesWord', { letter: letter, word: word.say })
      : t('fb.yesLetter', { letter: letter });
    const pic = $('fb-pic');
    pic.className = 'fb-pic';
    paintFace(pic, letter, 'fb-pic');
    $('fb-joined').textContent =
      isNew ? t(word ? 'fb.joined' : 'fb.joinedLetter',
                { word: word ? word.say : letter, letter: letter }) : '';
    $('fb-next').textContent = t('fb.next');
    fb.hidden = false;
    fb.classList.remove('is-in');
    void fb.offsetWidth;
    fb.classList.add('is-in');
  }

  function advance() {
    if (state.zoo.length >= level().collectTarget) { zooFull(); return; }
    nextQuestion();
  }

  function zooFull() {
    Sfx.fanfare();
    Fx.confetti({ count: 160, palette: 'gold' });
    $('zoo-full-text').textContent = t('zoo.text', { n: state.zoo.length });
    const row = $('zoo-full-row');
    row.innerHTML = '';
    state.zoo.forEach((l) => {
      const cell = document.createElement('div');
      cell.className = 'zoo-slot is-home';
      cell.appendChild(paintFace(document.createElement('span'), l, 'zoo-pic'));
      const tag = document.createElement('b');
      tag.textContent = l;
      cell.appendChild(tag);
      row.appendChild(cell);
    });
    show('s-zoo');
  }

  function newZoo() {
    state.zoo = [];
    saveJson(ZOO_KEY, { zoo: state.zoo, collected: state.collected });
    renderZoo();
    show('s-play');
    nextQuestion();
  }

  /* ------------------------------------------------------ my letters */

  const LEVEL_ORDER = ['unseen', 'learning', 'shaky', 'mastered'];

  function showStats() {
    const grid = $('letter-grid');
    grid.innerHTML = '';
    alphabet().forEach((l) => {
      const cell = document.createElement('div');
      const lvl = Progress.level(l);
      cell.className = 'letter-cell is-' + lvl;
      cell.innerHTML = '<b>' + l + '</b>';
      const w = wordFor(l);
      if (w) {
        const pic = document.createElement('span');
        Sprites.paint(pic, w.sprite);
        pic.className += ' letter-pic';
        cell.appendChild(pic);
      } else {
        cell.classList.add('is-wordless');
      }
      cell.title = (w ? l + ' — ' + w.say : l) + ' — ' + t('stats.' + lvl);
      grid.appendChild(cell);
    });

    $('stats-summary').textContent = t('stats.summary', Progress.summary(alphabet()));

    const legend = $('stats-legend');
    legend.innerHTML = '';
    LEVEL_ORDER.forEach((lvl) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="swatch is-' + lvl + '"></span>';
      li.appendChild(document.createTextNode(t('stats.' + lvl)));
      legend.appendChild(li);
    });

    const weak = Progress.weakest(6, alphabet());
    const list = $('weak-list');
    list.innerHTML = '';
    weak.forEach((w) => {
      const chip = document.createElement('div');
      chip.className = 'weak-chip';
      chip.innerHTML = '<b>' + w.letter + '</b><span>' + w.f.wrong + '/' + w.f.seen + '</span>';
      list.appendChild(chip);
    });
    $('weak-title').hidden = !weak.length;

    show('s-stats');
  }

  /* --------------------------------------------------- title controls */

  function renderLevels() {
    const row = $('level-row');
    row.innerHTML = '';
    LEVELS.forEach((l) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'seg' + (l.id === state.levelId ? ' is-on' : '');
      btn.textContent = t('level.' + l.id + '.name');
      btn.addEventListener('click', () => {
        Sfx.click();
        state.levelId = l.id;
        saveJson(LEVEL_KEY, l.id);
        state.zoo = [];                     // a new level means a new zoo size
        saveJson(ZOO_KEY, { zoo: state.zoo, collected: state.collected });
        renderTitle();
      });
      row.appendChild(btn);
    });
    $('level-note').textContent = t('level.' + state.levelId + '.desc');
  }

  function renderLanguages() {
    const row = $('language-row');
    row.innerHTML = '';
    I18n.langs.forEach((l) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'seg' + (l.id === I18n.get() ? ' is-on' : '');
      btn.textContent = l.label;
      btn.addEventListener('click', () => {
        Sfx.click();
        if (l.id === I18n.get()) return;
        I18n.setLang(l.id);
        useLanguage(l.id);
        // A Czech zoo cannot be carried into an English one: Ž has no tile
        // there. The collection is per-alphabet, so it starts over.
        state.zoo = [];
        saveJson(ZOO_KEY, { zoo: state.zoo, collected: state.collected });
        renderZoo();
        renderTitle();
      });
      row.appendChild(btn);
    });
  }

  /* Which system settings page has the voices, so the hint is the one the
     parent can actually follow rather than a list of four. */
  function platformHelpKey() {
    const ua = (navigator.userAgent || '') + ' ' + (navigator.platform || '');
    if (/android/i.test(ua)) return 'voiceHelp.android';
    if (/iphone|ipad|ipod/i.test(ua)) return 'voiceHelp.ios';
    if (/windows|win32|win64/i.test(ua)) return 'voiceHelp.win';
    if (/mac/i.test(ua)) return 'voiceHelp.mac';
    return 'voiceHelp.other';
  }

  /* The parent's own choice of voice. The automatic pick is right often enough
     to be the default and wrong often enough that it cannot be the only
     option: machines carry several voices per language and some of them are
     barely intelligible. */
  function renderVoicePicker() {
    const panel = $('voice-picker');
    if (!panel) return;
    const voices = Speech.list();
    panel.hidden = voices.length < 2;
    if (panel.hidden) return;

    const sel = $('voice-select');
    const chosen = Speech.isPinned() ? Speech.voiceName() : '';
    sel.innerHTML = '';
    const auto = document.createElement('option');
    auto.value = '';
    auto.textContent = t('ui.voiceAuto');
    sel.appendChild(auto);
    voices.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      // A voice of the wrong language is still offered — sometimes it is all
      // there is — but it says so, and it says which language it really is.
      opt.textContent = v.name + (v.speaksLang ? '' : '  · ' + v.lang);
      sel.appendChild(opt);
    });
    sel.value = chosen;
    $('voice-test').textContent = t('ui.voiceTest');
  }

  function renderToggles() {
    $('sound-btn').textContent = t('ui.sound', { on: state.soundOn });
    const voice = $('voice-btn');
    voice.textContent = t('ui.voice', { on: state.voiceOn });
    // No voice installed: say so by disabling rather than pretending.
    voice.disabled = !Speech.available();
    voice.classList.toggle('is-off', !Speech.available());
    renderVoicePicker();
    // A voice that is not in the pack's language still speaks — the words are
    // respelled for it — but a parent should know why, and how to fix it.
    const note = $('voice-note');
    if (note) {
      const wrongLang = Speech.available() && !Speech.matchesLanguage();
      note.hidden = !wrongLang;
      if (wrongLang) note.textContent = t('ui.voiceWrongLang') + ' ' + t(platformHelpKey());
    }
  }

  function renderTitle() {
    renderLevels();
    renderLanguages();
    renderToggles();
    I18n.apply();
    $('start-btn').textContent = state.zoo.length ? t('ui.continue') : t('ui.start');
  }

  /* The alphabet pack and the voice follow the interface language together —
     they are the same choice, and letting them drift apart is how you end up
     with a British gentleman reading Czech animal names. */
  function useLanguage(id) {
    setPack(id);
    Speech.setLang(voiceLang(), { romanize: romanizer() });
  }

  /* ------------------------------------------------------------ wiring */

  const ACTIONS = {
    start: () => {
      renderZoo();
      show('s-play');
      nextQuestion();
    },
    help: () => { I18n.apply(); show('s-help'); },
    stats: showStats,
    home: () => { renderTitle(); show('s-title'); },
    next: advance,
    replay: speakCue,
    'new-zoo': newZoo,
    'reset-stats': () => { Progress.reset(); toast(t('stats.cleared')); showStats(); },
    sound: () => {
      state.soundOn = Sfx.toggleMute() === false;
      renderToggles();
    },
    voice: () => {
      state.voiceOn = !state.voiceOn;
      Speech.setEnabled(state.voiceOn);
      renderToggles();
      if (state.voiceOn) speakCue();
    },
    // Judging a voice means hearing it, on a line that carries the sounds an
    // English voice cannot make.
    'voice-test': () => Speech.say(sampleLine())
  };

  document.addEventListener('change', (event) => {
    if (event.target.id !== 'voice-select') return;
    Speech.setVoiceByName(event.target.value || null);
    renderToggles();
    Speech.say(sampleLine());
  });

  document.addEventListener('click', (event) => {
    const btn = event.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    const fn = ACTIONS[btn.dataset.action];
    if (!fn) return;
    if (btn.dataset.action !== 'sound' && btn.dataset.action !== 'voice') Sfx.click();
    fn();
  });

  /* -------------------------------------------------------------- boot */

  Tex.install();
  Fx.init();
  Backdrop.init();
  Backdrop.setSkin('zoo');
  I18n.init();
  Speech.init();
  useLanguage(I18n.get());

  state.levelId = loadJson(LEVEL_KEY, DEFAULT_LEVEL);
  if (!LEVELS.some((l) => l.id === state.levelId)) state.levelId = DEFAULT_LEVEL;
  const saved = loadJson(ZOO_KEY, { zoo: [], collected: {} });
  state.zoo = Array.isArray(saved.zoo) ? saved.zoo : [];
  state.collected = saved.collected || {};

  renderTitle();
  renderZoo();
  show('s-title');

  // Voices arrive asynchronously in some browsers; refresh the toggle when they do.
  setTimeout(renderToggles, 800);
})();

</script>
</body>
</html>
