# Publish a build from a private repository as a public release here.
#
# Deliberately generic: every project-specific value is an input, so the same
# workflow serves math-game, a new project, or a build from a branch, with no
# edit to this file. The only thing to keep consistent is the naming rule —
# folder `<project>/` and tag `<project>/v<version>` — which is what keeps
# projects from mixing on the releases page.
#
# Actions -> Publish a build -> Run workflow.

name: Publish a build

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project short name — must match the folder here (e.g. math-game)'
        required: true
        type: string
      version:
        description: 'Version, without a leading v (e.g. 0.1.0)'
        required: true
        type: string
      source_repo:
        description: 'Private repo the build came from (owner/name)'
        required: true
        type: string
      run_id:
        description: 'Actions run ID holding the artifact (artifact mode only)'
        required: false
        type: string
      artifact_name:
        description: 'Artifact name on that run (blank = download them all)'
        required: false
        type: string
      source_path:
        description: 'Instead of an artifact: a path in the source repo. A directory is zipped, a file is taken as-is.'
        required: false
        type: string
      source_ref:
        description: 'Branch, tag or SHA for source_path mode (blank = default branch)'
        required: false
        type: string
      append:
        description: 'Add these files to the release if the tag already exists, instead of failing'
        required: false
        default: false
        type: boolean
      title:
        description: 'Release title (blank = "<project> <version>")'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # to create the release here

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fail with something readable rather than a 404 from gh further down.
      # Only needed when the build comes from somewhere this repo's own token
      # cannot read — which is every private source repo, but not this one.
      - name: Check the source token exists
        if: inputs.source_repo != github.repository
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Secret SOURCE_TOKEN is not set. It needs a fine-grained PAT with"
            echo "::error::Actions: Read-only (and Contents: Read-only for source_path mode)"
            echo "::error::on ${{ inputs.source_repo }}. See the repo README."
            exit 1
          fi

      - name: Check the project folder exists
        run: |
          if [ ! -d "${{ inputs.project }}" ]; then
            echo "::error::No folder named '${{ inputs.project }}' in this repo."
            echo "::error::Create it with a README first — the folder and the tag prefix"
            echo "::error::must match, or the releases page stops being sorted by project."
            exit 1
          fi

      # Artifacts are always zipped by Actions; `gh run download` unpacks them,
      # so what lands in assets/ is the real files, not a wrapper zip.
      - name: Download the build from ${{ inputs.source_repo }}
        if: inputs.source_path == ''
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "${{ inputs.run_id }}" ]; then
            echo "::error::Artifact mode needs run_id. Set source_path instead to take"
            echo "::error::files straight out of the repository."
            exit 1
          fi
          mkdir -p assets
          if [ -n "${{ inputs.artifact_name }}" ]; then
            gh run download "${{ inputs.run_id }}" \
              --repo "${{ inputs.source_repo }}" \
              --name "${{ inputs.artifact_name }}" \
              --dir assets
          else
            gh run download "${{ inputs.run_id }}" \
              --repo "${{ inputs.source_repo }}" \
              --dir assets
          fi
          # Flatten: gh nests per-artifact folders when more than one is pulled.
          find assets -mindepth 2 -type f -exec mv -n -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          echo "Downloaded:"
          ls -lh assets

      # Path mode: the build is committed in the source repo rather than being
      # an Actions artifact. The iPad edition is like this — it is checked in
      # precisely so that installing it needs no toolchain.
      - name: Check out ${{ inputs.source_repo }}
        if: inputs.source_path != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ inputs.source_repo == github.repository && github.token || secrets.SOURCE_TOKEN }}
          path: .source
          fetch-depth: 1

      - name: Collect the build from that checkout
        if: inputs.source_path != ''
        env:
          SRC: ${{ inputs.source_path }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p assets
          FULL=".source/$SRC"
          if [ -d "$FULL" ]; then
            # A directory is only useful to someone as one file they can unpack.
            NAME="$PROJECT-$VERSION-$(basename "$SRC").zip"
            (cd "$FULL" && zip -qr "$GITHUB_WORKSPACE/assets/$NAME" .)
          elif [ -f "$FULL" ]; then
            cp "$FULL" assets/
          else
            echo "::error::No such path in ${{ inputs.source_repo }}: $SRC"
            exit 1
          fi
          echo "Collected:"
          ls -lh assets

      - name: Checksum every file
        id: sums
        run: |
          {
            echo 'body<<RELEASE_BODY_EOF'
            if [ -n "${{ inputs.source_path }}" ]; then
              echo "Built from \`${{ inputs.source_repo }}\`, path \`${{ inputs.source_path }}\`."
            else
              echo "Built from \`${{ inputs.source_repo }}\` run [${{ inputs.run_id }}](https://github.com/${{ inputs.source_repo }}/actions/runs/${{ inputs.run_id }})."
            fi
            echo
            echo 'Windows `.exe` files here are not code-signed, so SmartScreen shows'
            echo '"Windows protected your PC" on first run — choose **More info → Run anyway**.'
            echo
            echo '### SHA-256'
            echo
            echo '```'
            cd assets && sha256sum * || shasum -a 256 *
            echo '```'
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # Every value reaches the shell as an environment variable, never as
      # ${{ }} pasted into the script. The release body is markdown full of
      # backticks and code fences; interpolated directly, bash reads those as
      # command substitution and the step dies before gh ever runs. Passing it
      # through env and a file is both correct and the only safe way to handle
      # text this workflow did not write.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.project }}/v${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ steps.sums.outputs.body }}
          PRERELEASE: ${{ inputs.prerelease }}
          APPEND: ${{ inputs.append }}
        run: |
          : "${TITLE:=$PROJECT $VERSION}"

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$APPEND" != "true" ]; then
              echo "::error::Release $TAG already exists. Bump the version, pass append,"
              echo "::error::or delete it first."
              exit 1
            fi
            # Same project, same version, another platform. Keep the existing
            # notes and add this source's checksums, so the release never lists
            # only some of what is attached to it.
            gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/old.md"
            cat "$RUNNER_TEMP/old.md" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/merged.md"
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/merged.md"
            {
              echo "### Added to \`$TAG\`"
              gh release view "$TAG" --json url --jq .url
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Dispatched through the API a boolean input can arrive as the string
          # "false", which is truthy in an Actions expression — so compare it
          # here rather than relying on `inputs.prerelease && ...`.
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"

          gh release create "$TAG" assets/* \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $FLAGS

          {
            echo "### Published \`$TAG\`"
            gh release view "$TAG" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
