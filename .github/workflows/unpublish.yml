# Withdraw a release. One-off tool: added to retract a-z-app/v0.1.0, which was
# published before the app was ready, and removed again in the next commit.
#
# Nothing in this repository should be able to delete a public release as a
# standing capability.
name: Unpublish a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to withdraw (e.g. a-z-app/v0.1.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No release tagged $TAG"
            exit 1
          fi
          gh release delete "$TAG" --yes
          git push origin --delete "refs/tags/$TAG" || echo "tag already gone"
          echo "withdrew $TAG" >> "$GITHUB_STEP_SUMMARY"
